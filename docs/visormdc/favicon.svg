<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Fondo oscuro con degradado radial sutil -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Contorno del visor en degradado azul cielo ADIF -->
    <linearGradient id="fav-eye-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Resplandor del iris -->
    <radialGradient id="fav-iris-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fondo contenedor redondeado con bisel -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#fav-bg)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Aura tenue interna -->
  <circle cx="32" cy="32" r="22" fill="#38bdf8" opacity="0.08" />

  <!-- Contorno geométrico del ojo / visor óptico -->
  <path
    d="M 10 32 C 18 14, 46 14, 54 32 C 46 50, 18 50, 10 32 Z"
    fill="none"
    stroke="url(#fav-eye-stroke)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Anillo del iris -->
  <circle
    cx="32"
    cy="32"
    r="10"
    fill="none"
    stroke="#38bdf8"
    stroke-width="3.5"
  />

  <!-- Resplandor del iris -->
  <circle cx="32" cy="32" r="8" fill="url(#fav-iris-glow)" opacity="0.75" />

  <!-- Pupila central blanca -->
  <circle cx="32" cy="32" r="4.2" fill="#ffffff" />
</svg>
